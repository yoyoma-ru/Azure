<svg xmlns="http://www.w3.org/2000/svg" width="680" height="362" viewBox="0 0 680 362" role="img">
<title>コンシューマーインスタンスとパーティションの割り当て</title>
<desc>パーティション4本に対し、受信インスタンスを1台・2台・4台・5台に増やしたときの担当（ownership）の分かれ方を示す表。1台は全担当、増やすと分担、4台で1本ずつ、5台目は待機。</desc>
<style>
  text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;}
  .t{font-size:14px;fill:#26251F;}
  .th{font-size:14px;font-weight:500;fill:#26251F;}
  .ts{font-size:12px;fill:#5F5E5A;}
  .c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1;} .c-teal .th{fill:#04342C;}
  .c-blue rect{fill:#E6F1FB;stroke:#185FA5;stroke-width:1;} .c-blue .th{fill:#042C53;}
  .c-amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:1;} .c-amber .th{fill:#412402;}
  .c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1;} .c-purple .th{fill:#26215C;}
  @media (prefers-color-scheme:dark){
    .t,.th{fill:#ECEBE5;} .ts{fill:#B4B2A9;}
    .c-teal rect{fill:#085041;stroke:#5DCAA5;} .c-teal .th{fill:#E1F5EE;}
    .c-blue rect{fill:#0C447C;stroke:#85B7EB;} .c-blue .th{fill:#E6F1FB;}
    .c-amber rect{fill:#633806;stroke:#EF9F27;} .c-amber .th{fill:#FAEEDA;}
    .c-purple rect{fill:#3C3489;stroke:#AFA9EC;} .c-purple .th{fill:#EEEDFE;}
  }
</style>

<text class="ts" x="44" y="26" text-anchor="start">A〜E＝受信インスタンス　／　P0〜P3＝パーティション（4本で固定）</text>

<text class="th" x="44" y="56" text-anchor="start">インスタンス数</text>
<text class="th" x="236" y="56" text-anchor="middle">P0</text>
<text class="th" x="336" y="56" text-anchor="middle">P1</text>
<text class="th" x="436" y="56" text-anchor="middle">P2</text>
<text class="th" x="536" y="56" text-anchor="middle">P3</text>

<text class="th" x="44" y="95" text-anchor="start">1 台</text>
<g class="c-teal"><rect x="190" y="66" width="92" height="46" rx="6"/><text class="th" x="236" y="95" text-anchor="middle">A</text></g>
<g class="c-teal"><rect x="290" y="66" width="92" height="46" rx="6"/><text class="th" x="336" y="95" text-anchor="middle">A</text></g>
<g class="c-teal"><rect x="390" y="66" width="92" height="46" rx="6"/><text class="th" x="436" y="95" text-anchor="middle">A</text></g>
<g class="c-teal"><rect x="490" y="66" width="92" height="46" rx="6"/><text class="th" x="536" y="95" text-anchor="middle">A</text></g>

<text class="th" x="44" y="153" text-anchor="start">2 台</text>
<g class="c-teal"><rect x="190" y="124" width="92" height="46" rx="6"/><text class="th" x="236" y="153" text-anchor="middle">A</text></g>
<g class="c-teal"><rect x="290" y="124" width="92" height="46" rx="6"/><text class="th" x="336" y="153" text-anchor="middle">A</text></g>
<g class="c-blue"><rect x="390" y="124" width="92" height="46" rx="6"/><text class="th" x="436" y="153" text-anchor="middle">B</text></g>
<g class="c-blue"><rect x="490" y="124" width="92" height="46" rx="6"/><text class="th" x="536" y="153" text-anchor="middle">B</text></g>

<text class="th" x="44" y="211" text-anchor="start">4 台</text>
<g class="c-teal"><rect x="190" y="182" width="92" height="46" rx="6"/><text class="th" x="236" y="211" text-anchor="middle">A</text></g>
<g class="c-blue"><rect x="290" y="182" width="92" height="46" rx="6"/><text class="th" x="336" y="211" text-anchor="middle">B</text></g>
<g class="c-amber"><rect x="390" y="182" width="92" height="46" rx="6"/><text class="th" x="436" y="211" text-anchor="middle">C</text></g>
<g class="c-purple"><rect x="490" y="182" width="92" height="46" rx="6"/><text class="th" x="536" y="211" text-anchor="middle">D</text></g>

<text class="th" x="44" y="269" text-anchor="start">5 台</text>
<g class="c-teal"><rect x="190" y="240" width="92" height="46" rx="6"/><text class="th" x="236" y="269" text-anchor="middle">A</text></g>
<g class="c-blue"><rect x="290" y="240" width="92" height="46" rx="6"/><text class="th" x="336" y="269" text-anchor="middle">B</text></g>
<g class="c-amber"><rect x="390" y="240" width="92" height="46" rx="6"/><text class="th" x="436" y="269" text-anchor="middle">C</text></g>
<g class="c-purple"><rect x="490" y="240" width="92" height="46" rx="6"/><text class="th" x="536" y="269" text-anchor="middle">D</text></g>

<text class="ts" x="44" y="302" text-anchor="start">＋ E は担当なし＝待機（誰かが落ちたら引き継ぐ）</text>
<text class="ts" x="44" y="328" text-anchor="start">1 パーティション = 1 所有者（同時に読むのは 1 台）</text>
<text class="ts" x="44" y="348" text-anchor="start">ownership・checkpoint は共有 Blob（パーティション単位）</text>
</svg>
